<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Void — Living Background</title>
<script type="importmap">
{ "imports": {
  "three":"https://unpkg.com/three@0.169.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"
}}
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#04060a;font-family:"source-code-pro",ui-monospace,monospace;color:#cfe8ff}
  #scene{position:fixed;inset:0;display:block}
  #panel{position:fixed;top:1rem;right:1rem;z-index:5;width:214px;background:rgba(8,14,22,.85);border:1px solid rgba(79,210,255,.3);border-radius:12px;padding:.8rem .9rem;backdrop-filter:blur(8px);font-size:.66rem;letter-spacing:.08em}
  #panel h3{color:#4fd2ff;letter-spacing:.2em;text-transform:uppercase;font-size:.6rem;margin-bottom:.6rem}
  #panel .chk{display:flex;gap:.5rem;align-items:center;color:#8fb0cc;margin:.4rem 0;text-transform:uppercase;cursor:pointer}
  #panel label{display:block;color:#8fb0cc;text-transform:uppercase;margin:.6rem 0 .2rem;font-size:.58rem}
  #panel input[type=range]{width:100%;accent-color:#4fd2ff}
  #panel button{width:100%;margin-top:.7rem;font:inherit;color:#eaf4ff;background:rgba(79,210,255,.2);border:1px solid rgba(79,210,255,.5);border-radius:8px;padding:.45rem;cursor:pointer;text-transform:uppercase;letter-spacing:.12em}
  #panel button:hover{background:rgba(79,210,255,.3)}
  #tip{position:fixed;left:1.4rem;bottom:1.2rem;z-index:5;color:#5b768f;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="panel">
  <h3>Living void</h3>
  <div class="chk"><input type="checkbox" id="tBloom" checked> bloom glow</div>
  <div class="chk"><input type="checkbox" id="tDrift" checked> organic drift</div>
  <div class="chk"><input type="checkbox" id="tLines" checked> energy lines</div>
  <div class="chk"><input type="checkbox" id="tTwinkle" checked> twinkle</div>
  <div class="chk"><input type="checkbox" id="tNebula" checked> nebula clouds</div>
  <label>bloom strength</label><input type="range" id="bStr" min="0" max="2.5" step="0.05" value="1.0">
  <label>nebula intensity</label><input type="range" id="nStr" min="0" max="1.6" step="0.05" value="1.0">
  <button id="warp">⚡ Warp burst</button>
</div>
<div id="tip">move mouse — the void leans with you</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const canvas=document.querySelector('#scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x04060a,0.0016);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,4000);camera.position.set(0,0,160);

// ---- ANIMATED NEBULA BACKGROUND (replaces the flat black) ----
const bgMat=new THREE.ShaderMaterial({
  depthTest:false,depthWrite:false,fog:false,
  uniforms:{uTime:{value:0},uIntensity:{value:1},uAspect:{value:innerWidth/innerHeight}},
  vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position.xy,0.999,1.0);}`,
  fragmentShader:`
    varying vec2 vUv; uniform float uTime,uIntensity,uAspect;
    float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    float noise(vec2 p){vec2 i=floor(p),f=fract(p);float a=hash(i),b=hash(i+vec2(1,0)),c=hash(i+vec2(0,1)),d=hash(i+vec2(1,1));vec2 u=f*f*(3.0-2.0*f);return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);}
    float fbm(vec2 p){float v=0.0,a=0.5;for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.02+vec2(1.7);a*=0.5;}return v;}
    void main(){
      vec2 uv=vUv; uv.x*=uAspect;
      float t=uTime*0.03;
      float n =fbm(uv*2.4+vec2(t,t*0.6));
      float n2=fbm(uv*1.5-vec2(t*0.5,t*0.2)+5.0);
      vec3 base  =vec3(0.012,0.020,0.030);
      vec3 teal  =vec3(0.05,0.17,0.24);
      vec3 violet=vec3(0.11,0.06,0.20);
      vec3 ember =vec3(0.22,0.09,0.03);
      vec3 col=base;
      col+=teal  *smoothstep(0.35,0.95,n)*0.9;
      col+=violet*smoothstep(0.55,1.05,n2)*0.55;
      col+=ember *smoothstep(0.72,1.05,n*n2)*0.7;
      float d=distance(vUv,vec2(0.5)); col*=1.0-0.55*smoothstep(0.35,0.95,d); // vignette
      gl_FragColor=vec4(col*uIntensity,1.0);
    }`
});
const bg=new THREE.Mesh(new THREE.PlaneGeometry(2,2),bgMat);
bg.frustumCulled=false; bg.renderOrder=-10;
scene.add(bg);   // full-screen nebula, rendered first inside the main scene

// ---- node field ----
const N=750, SPREAD=700;
const base=new Float32Array(N*3), pos=new Float32Array(N*3);
const amp=new Float32Array(N*3), fre=new Float32Array(N*3), pha=new Float32Array(N*3);
const aPhase=new Float32Array(N), aScale=new Float32Array(N), aColor=new Float32Array(N*3);
const cCyan=new THREE.Color(0x6fe0ff), cWhite=new THREE.Color(0xeaf4ff), cOrange=new THREE.Color(0xff7a3d), tc=new THREE.Color();
for(let i=0;i<N;i++){
  base[i*3]=(Math.random()-.5)*SPREAD;base[i*3+1]=(Math.random()-.5)*SPREAD*0.7;base[i*3+2]=(Math.random()-.5)*SPREAD-150;
  for(let k=0;k<3;k++){amp[i*3+k]=4+Math.random()*14;fre[i*3+k]=0.2+Math.random()*0.6;pha[i*3+k]=Math.random()*6.28;}
  aPhase[i]=Math.random()*6.28; aScale[i]=0.6+Math.random()*1.8;
  const r=Math.random(); tc.copy(r<0.12?cOrange:(r<0.5?cWhite:cCyan));
  aColor[i*3]=tc.r;aColor[i*3+1]=tc.g;aColor[i*3+2]=tc.b;
}
const pgeo=new THREE.BufferGeometry();
pgeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
pgeo.setAttribute('aPhase',new THREE.BufferAttribute(aPhase,1));
pgeo.setAttribute('aScale',new THREE.BufferAttribute(aScale,1));
pgeo.setAttribute('aColor',new THREE.BufferAttribute(aColor,3));
const pmat=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  uniforms:{uTime:{value:0},uSize:{value:9},uTwinkle:{value:1},uWarp:{value:0}},
  vertexShader:`attribute float aPhase; attribute float aScale; attribute vec3 aColor;
    uniform float uTime,uSize,uTwinkle,uWarp; varying vec3 vC; varying float vTw;
    void main(){float tw=mix(1.0,0.55+0.45*sin(uTime*1.6+aPhase),uTwinkle);vC=aColor;vTw=tw;
      vec4 mv=modelViewMatrix*vec4(position,1.0);gl_Position=projectionMatrix*mv;
      gl_PointSize=aScale*uSize*tw*(1.0+uWarp*1.6)*(300.0/ -mv.z);}`,
  fragmentShader:`varying vec3 vC; varying float vTw;
    void main(){float d=length(gl_PointCoord-0.5);if(d>0.5)discard;float a=smoothstep(0.5,0.0,d);gl_FragColor=vec4(vC*(0.7+vTw),a*vTw);}`
});
const points=new THREE.Points(pgeo,pmat);scene.add(points);

// ---- connections ----
const pairs=[];const TH=70;
for(let i=0;i<N;i++){let c=0;for(let j=i+1;j<N&&c<3;j++){const dx=base[i*3]-base[j*3],dy=base[i*3+1]-base[j*3+1],dz=base[i*3+2]-base[j*3+2];if(dx*dx+dy*dy+dz*dz<TH*TH){pairs.push(i,j);c++;}}}
const L=pairs.length/2;
const lpos=new Float32Array(L*2*3), lT=new Float32Array(L*2), lPhase=new Float32Array(L*2), lCol=new Float32Array(L*2*3);
for(let k=0;k<L;k++){const ph=Math.random();const a=pairs[k*2],b=pairs[k*2+1];lT[k*2]=0;lT[k*2+1]=1;lPhase[k*2]=lPhase[k*2+1]=ph;
  for(let v=0;v<2;v++){const idx=v===0?a:b;lCol[(k*2+v)*3]=aColor[idx*3];lCol[(k*2+v)*3+1]=aColor[idx*3+1];lCol[(k*2+v)*3+2]=aColor[idx*3+2];}}
const lgeo=new THREE.BufferGeometry();
lgeo.setAttribute('position',new THREE.BufferAttribute(lpos,3));
lgeo.setAttribute('aT',new THREE.BufferAttribute(lT,1));
lgeo.setAttribute('aLPhase',new THREE.BufferAttribute(lPhase,1));
lgeo.setAttribute('aLColor',new THREE.BufferAttribute(lCol,3));
const lmat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  uniforms:{uTime:{value:0},uOn:{value:1}},
  vertexShader:`attribute float aT; attribute float aLPhase; attribute vec3 aLColor; varying float vT;varying float vP;varying vec3 vC;
    void main(){vT=aT;vP=aLPhase;vC=aLColor;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`varying float vT;varying float vP;varying vec3 vC;uniform float uTime,uOn;
    void main(){float life=0.10+0.18*sin(uTime*0.35+vP*6.2831);float head=fract(uTime*0.22+vP);float pulse=smoothstep(0.05,0.0,abs(vT-head));
      float a=clamp(life+pulse*0.9,0.0,1.0)*uOn;gl_FragColor=vec4(vC+pulse*vec3(0.5),a);}`});
const lines=new THREE.LineSegments(lgeo,lmat);scene.add(lines);

// ---- bloom ----
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.0,0.7,0.22); // threshold .22 → only bright nodes bloom, not the nebula
composer.addPass(bloom);composer.setSize(innerWidth,innerHeight);

// ---- controls ----
const $=s=>document.querySelector(s);
let drift=true,bloomOn=true;
$('#tBloom').onchange=e=>bloomOn=e.target.checked;
$('#tDrift').onchange=e=>drift=e.target.checked;
$('#tLines').onchange=e=>lmat.uniforms.uOn.value=e.target.checked?1:0;
$('#tTwinkle').onchange=e=>pmat.uniforms.uTwinkle.value=e.target.checked?1:0;
$('#tNebula').onchange=e=>bg.visible=e.target.checked;
$('#bStr').oninput=e=>bloom.strength=+e.target.value;
$('#nStr').oninput=e=>bgMat.uniforms.uIntensity.value=+e.target.value;
let warp=0;$('#warp').onclick=()=>warp=1;
setInterval(()=>{if(document.hasFocus())warp=Math.max(warp,0.9);},9000);

// ---- mouse lean (no cursor follower) ----
const mouse={x:0,y:0};
addEventListener('pointermove',e=>{mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);bgMat.uniforms.uAspect.value=innerWidth/innerHeight;});

const clock=new THREE.Clock();const baseZ=160;
function frame(){
  const t=clock.getElapsedTime();
  pmat.uniforms.uTime.value=t;lmat.uniforms.uTime.value=t;bgMat.uniforms.uTime.value=t;
  for(let i=0;i<N;i++){const dz=drift?1:0;
    pos[i*3]  =base[i*3]  +dz*amp[i*3]  *Math.sin(t*fre[i*3]  +pha[i*3]);
    pos[i*3+1]=base[i*3+1]+dz*amp[i*3+1]*Math.sin(t*fre[i*3+1]+pha[i*3+1]);
    pos[i*3+2]=base[i*3+2]+dz*amp[i*3+2]*Math.sin(t*fre[i*3+2]+pha[i*3+2]);}
  pgeo.attributes.position.needsUpdate=true;
  for(let k=0;k<L;k++){const a=pairs[k*2],b=pairs[k*2+1];
    lpos[(k*2)*3]=pos[a*3];lpos[(k*2)*3+1]=pos[a*3+1];lpos[(k*2)*3+2]=pos[a*3+2];
    lpos[(k*2+1)*3]=pos[b*3];lpos[(k*2+1)*3+1]=pos[b*3+1];lpos[(k*2+1)*3+2]=pos[b*3+2];}
  lgeo.attributes.position.needsUpdate=true;

  warp*=0.94;if(warp<0.001)warp=0;
  pmat.uniforms.uWarp.value=warp;bloom.strength=(+$('#bStr').value)+warp*0.9;camera.position.z=baseZ-warp*55;

  points.rotation.y+=((mouse.x*0.25)-points.rotation.y)*0.04;
  points.rotation.x+=((-mouse.y*0.18)-points.rotation.x)*0.04;
  lines.rotation.copy(points.rotation);

  if(bloomOn) composer.render(); else renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
