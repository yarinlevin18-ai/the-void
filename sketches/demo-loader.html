<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Void — Entering (loader)</title>
<link rel="stylesheet" href="https://use.typekit.net/xan5bdy.css"/>
<script type="importmap">
{ "imports": {
  "three":"https://unpkg.com/three@0.169.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"
}}
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#03040a;font-family:"acumin-pro",system-ui,sans-serif;color:#cfe8ff}
  #scene{position:fixed;inset:0;display:block}
  /* ---- HUD ---- */
  #hud{position:fixed;inset:0;z-index:3;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .mono{font-family:"source-code-pro",monospace;color:#7fe0ff;letter-spacing:.34em;text-transform:uppercase;font-size:.72rem}
  #pct{font-family:"ogg",serif;color:#eaf6ff;font-weight:600;
    font-size:clamp(4rem,16vw,11rem);line-height:.9;letter-spacing:0;
    text-shadow:0 0 40px rgba(120,200,255,.45);font-variant-numeric:tabular-nums}
  #bar{width:min(46vw,360px);height:1px;background:rgba(150,180,220,.18);margin-top:1.4rem;position:relative;overflow:hidden}
  #bar i{position:absolute;inset:0 100% 0 0;background:linear-gradient(90deg,#1ad9ff,#a06bff);box-shadow:0 0 14px #1ad9ff}
  #sub{margin-top:1rem;color:#5f7da0}
  /* ---- wordmark reveal ---- */
  #mark{position:fixed;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none}
  #mark h1{font-family:"ogg",serif;font-weight:600;color:#fff;font-size:clamp(3.4rem,12vw,11rem);
    line-height:1;letter-spacing:.01em;clip-path:inset(0 0 100% 0);text-shadow:0 0 50px rgba(150,200,255,.4)}
  #flash{position:fixed;inset:0;z-index:5;background:#dff2ff;opacity:0;pointer-events:none;mix-blend-mode:screen}
  #enter{position:fixed;left:50%;bottom:8vh;transform:translateX(-50%);z-index:6;opacity:0;
    font-family:"source-code-pro",monospace;letter-spacing:.3em;text-transform:uppercase;font-size:.7rem;
    color:#0a0f1c;background:#9fe6ff;border:0;padding:.85rem 1.6rem;border-radius:40px;cursor:pointer;
    box-shadow:0 0 30px rgba(120,210,255,.5);transition:transform .2s,box-shadow .2s}
  #enter:hover{transform:translateX(-50%) scale(1.05);box-shadow:0 0 46px rgba(120,210,255,.8)}
  @keyframes glitch{0%{transform:translate(0)}20%{transform:translate(-3px,1px)}40%{transform:translate(2px,-2px)}
    60%{transform:translate(-2px,-1px)}80%{transform:translate(3px,2px)}100%{transform:translate(0)}}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud">
  <div class="mono">Entering the void</div>
  <div id="pct">0</div>
  <div id="bar"><i></i></div>
  <div class="mono" id="sub">calibrating flight path</div>
</div>
<div id="mark"><h1>YARIN</h1></div>
<div id="flash"></div>
<button id="enter">Enter ↵</button>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const canvas=document.querySelector('#scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x03040a,0.0009);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.1,6000);

// faint nebula behind the warp (the world we're diving into)
const nebMat=new THREE.ShaderMaterial({depthTest:false,depthWrite:false,
  uniforms:{uTime:{value:0},uA:{value:innerWidth/innerHeight},uReveal:{value:0}},
  vertexShader:`varying vec2 v;void main(){v=uv;gl_Position=vec4(position.xy,0.999,1.0);}`,
  fragmentShader:`varying vec2 v;uniform float uTime,uA,uReveal;
   float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
   float n(vec2 p){vec2 i=floor(p),f=fract(p);float a=h(i),b=h(i+vec2(1,0)),c=h(i+vec2(0,1)),d=h(i+vec2(1,1));vec2 u=f*f*(3.-2.*f);return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);}
   float fbm(vec2 p){float s=0.,m=.5;for(int i=0;i<5;i++){s+=m*n(p);p=p*2.03+1.7;m*=.5;}return s;}
   void main(){vec2 uv=v;uv.x*=uA;float f=fbm(uv*2.4+vec2(uTime*0.02,0.0));
     vec3 col=vec3(0.012,0.018,0.030)+mix(vec3(0.05,0.16,0.25),vec3(0.13,0.07,0.24),0.5+0.5*sin(uTime*0.08))*smoothstep(0.42,1.0,f);
     col*=1.0-0.6*smoothstep(0.3,0.95,distance(v,vec2(0.5)));
     gl_FragColor=vec4(col*(0.25+0.75*uReveal),1.0);}`});
const neb=new THREE.Mesh(new THREE.PlaneGeometry(2,2),nebMat);neb.frustumCulled=false;neb.renderOrder=-10;scene.add(neb);

// ---- WARP star streaks: line segments stretched by speed ----
const N=1200, head=new Float32Array(N*3), verts=new Float32Array(N*6), col=new Float32Array(N*6);
function reset(i,far){const a=Math.random()*6.283,rad=20+Math.random()*240;
  head[i*3]=Math.cos(a)*rad; head[i*3+1]=Math.sin(a)*rad;
  head[i*3+2]=far?-1600-Math.random()*1400:-Math.random()*1600;}
for(let i=0;i<N;i++)reset(i,false);
const g=new THREE.BufferGeometry();
g.setAttribute('position',new THREE.BufferAttribute(verts,3));
g.setAttribute('color',new THREE.BufferAttribute(col,3));
const warp=new THREE.LineSegments(g,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(warp);

const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.1,0.8,0.0);composer.addPass(bloom);composer.setSize(innerWidth,innerHeight);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);nebMat.uniforms.uA.value=innerWidth/innerHeight;});

// ---- fake load: 0->100 with irregular ticks, speed ramps with progress ----
const $=s=>document.querySelector(s);
let prog=0, speed=6, done=false, reveal=0, shake=0;
const subs=['calibrating flight path','charging data-streams','aligning the void','engaging warp'];
function tick(){ if(prog>=100)return;
  prog=Math.min(100, prog + Math.random()*7 + 1.5);
  $('#pct').textContent=Math.floor(prog);
  $('#bar i').style.inset=`0 ${100-prog}% 0 0`;
  $('#sub').textContent=subs[Math.min(subs.length-1,Math.floor(prog/26))];
  if(prog>=100){launch();return;}
  setTimeout(tick, 90+Math.random()*230);
}
setTimeout(tick,500);

function launch(){
  // light punch + warp surge, then resolve the wordmark
  const fl=$('#flash');
  fl.style.transition='opacity .12s';fl.style.opacity='.9';
  speed=120;                                  // hyperspace jump
  setTimeout(()=>{fl.style.transition='opacity .8s';fl.style.opacity='0';},120);
  $('#hud').style.transition='opacity .5s';$('#hud').style.opacity='0';
  const mark=$('#mark'),h=mark.querySelector('h1');
  setTimeout(()=>{
    mark.style.transition='opacity .6s';mark.style.opacity='1';
    h.style.transition='clip-path 1.1s cubic-bezier(.16,1,.3,1)';
    h.style.clipPath='inset(0 0 0% 0)';
    h.style.animation='glitch .42s steps(2) 2';     // brief glitch as it lands
    revealStart=performance.now();
    setTimeout(()=>{ $('#enter').style.transition='opacity .6s';$('#enter').style.opacity='1'; },1100);
  },160);
}
let revealStart=0;
$('#enter').onclick=()=>{ // (real site: hand off to the scene) — here, dive again
  $('#enter').style.opacity='0';$('#mark').style.opacity='0';
  speed=200; setTimeout(()=>{prog=0;speed=6;reveal=0;revealStart=0;
    $('#hud').style.opacity='1';$('#pct').textContent='0';$('#bar i').style.inset='0 100% 0 0';
    for(let i=0;i<N;i++)reset(i,false); setTimeout(tick,400);},700);
};

const clock=new THREE.Clock();
function frame(){const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;
  nebMat.uniforms.uTime.value=t;
  // ramp speed with load; ease toward target each frame
  const target = done?speed: (6 + prog*1.1);
  speed += (speed>target? (speed-target)*-0.06 : (target-speed)*0.06);
  if(revealStart){reveal=Math.min(1,(performance.now()-revealStart)/1400);}
  nebMat.uniforms.uReveal.value=reveal;
  // advance stars toward camera, build stretched streaks
  const len = 1.5 + speed*0.9;                 // streak length grows with speed
  const p=g.attributes.position.array, c=g.attributes.color.array;
  for(let i=0;i<N;i++){
    head[i*3+2]+=speed*dt*60;
    if(head[i*3+2]>40){reset(i,true);}
    const x=head[i*3],y=head[i*3+1],z=head[i*3+2];
    p[i*6]=x;       p[i*6+1]=y;       p[i*6+2]=z;          // head
    p[i*6+3]=x;     p[i*6+4]=y;       p[i*6+5]=z-len;      // tail (trailing into depth)
    const b=Math.min(1,(z+1600)/1600);                     // brighter as it nears
    // cyan head -> violet tail
    c[i*6]=0.5*b;c[i*6+1]=0.85*b;c[i*6+2]=1.0*b;
    c[i*6+3]=0.35*b;c[i*6+4]=0.2*b;c[i*6+5]=0.7*b;
  }
  g.attributes.position.needsUpdate=true; g.attributes.color.needsUpdate=true;
  // a little camera roll + shake at the jump
  camera.rotation.z=Math.sin(t*0.1)*0.04 + (Math.random()-0.5)*Math.max(0,(speed-60))*0.0009;
  composer.render();requestAnimationFrame(frame);}
frame();
</script>
</body>
</html>
