<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Void — Neon Electric Wave</title>
<script type="importmap">
{ "imports": {
  "three":"https://unpkg.com/three@0.169.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"
}}
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#03030a;font-family:"source-code-pro",ui-monospace,monospace;color:#cfe8ff}
  #scene{position:fixed;inset:0;display:block}
  #panel{position:fixed;top:1rem;right:1rem;z-index:5;width:210px;background:rgba(10,8,22,.85);border:1px solid rgba(170,120,255,.3);border-radius:12px;padding:.8rem .9rem;backdrop-filter:blur(8px);font-size:.66rem;letter-spacing:.08em}
  #panel h3{color:#c79bff;letter-spacing:.2em;text-transform:uppercase;font-size:.6rem;margin-bottom:.6rem}
  #panel label{display:block;color:#9b8fcc;text-transform:uppercase;margin:.6rem 0 .2rem;font-size:.58rem}
  #panel input[type=range]{width:100%;accent-color:#c79bff}
  #panel .chk{display:flex;gap:.5rem;align-items:center;color:#9b8fcc;margin:.5rem 0;text-transform:uppercase;cursor:pointer}
  #tip{position:fixed;left:1.4rem;bottom:1.2rem;z-index:5;color:#6a5b8f;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="panel">
  <h3>Neon wave</h3>
  <label>wave height</label><input type="range" id="amp" min="0" max="40" step="1" value="18">
  <label>flow speed</label><input type="range" id="spd" min="0" max="3" step="0.05" value="1">
  <label>color shift</label><input type="range" id="hue" min="0" max="2" step="0.05" value="1">
  <label>bloom</label><input type="range" id="bStr" min="0" max="3" step="0.05" value="1.6">
  <div class="chk"><input type="checkbox" id="grid" checked> neon grid lines</div>
  <div class="chk"><input type="checkbox" id="fill" checked> glow fill</div>
</div>
<div id="tip">a neon electric wave flowing through the void · move mouse</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const canvas=document.querySelector('#scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x03030a,0.0016);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,4000);
camera.position.set(0,70,250);camera.lookAt(0,0,-120);

// shared wave shaders (a tilted plane displaced into rolling neon waves)
const uniforms={uTime:{value:0},uAmp:{value:18},uSpd:{value:1},uHue:{value:1}};
const VERT=`
  uniform float uTime,uAmp,uSpd; varying float vH; varying vec2 vUv;
  void main(){ vUv=uv; vec3 p=position;
    float t=uTime*uSpd;
    float h = sin(p.x*0.03 + t*1.6)*0.5
            + sin(p.y*0.045 - t*1.3)*0.7      // p.y is depth before the plane is laid flat
            + sin((p.x+p.y)*0.02 + t*1.0)*0.4
            + sin(p.x*0.08 + p.y*0.06 - t*2.2)*0.25;
    p.z += h*uAmp;                            // displace along the plane normal -> height
    vH=h;
    gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);
  }`;
function FRAG(lineMode){return `
  uniform float uTime,uHue; varying float vH; varying vec2 vUv;
  void main(){
    vec3 cyan=vec3(0.1,1.0,1.0), magenta=vec3(1.0,0.15,0.9), violet=vec3(0.5,0.25,1.0), blue=vec3(0.2,0.4,1.0);
    float m=0.5+0.5*sin(vUv.x*5.0 + vUv.y*7.0 - uTime*1.4*uHue);
    vec3 col=mix(cyan,magenta,m);
    col=mix(col, violet, 0.5+0.5*sin(uTime*0.6*uHue + vUv.y*4.0));
    col=mix(col, blue, 0.3*(0.5+0.5*sin(vUv.x*9.0+uTime)));
    float crest=smoothstep(0.2,1.0,vH);       // bright neon crests
    col+=crest*0.7;
    float a=${lineMode? '0.9' : '0.18 + crest*0.5'};
    gl_FragColor=vec4(col, a);
  }`;}

const geo=new THREE.PlaneGeometry(1100,1100,260,260);
geo.rotateX(-Math.PI*0.5);   // lay it flat (XZ); shader's p.z displacement = world height

const fillMat=new THREE.ShaderMaterial({uniforms,vertexShader:VERT,fragmentShader:FRAG(false),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
const lineMat=new THREE.ShaderMaterial({uniforms,vertexShader:VERT,fragmentShader:FRAG(true),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,wireframe:true});
const fill=new THREE.Mesh(geo,fillMat); fill.position.y=-20; scene.add(fill);
const grid=new THREE.Mesh(geo,lineMat); grid.position.y=-20; scene.add(grid);

// a second wave overhead, mirrored — neon canyon you fly between
const fill2=new THREE.Mesh(geo,fillMat); fill2.position.y=160; fill2.rotation.z=Math.PI; scene.add(fill2);
const grid2=new THREE.Mesh(geo,lineMat); grid2.position.y=160; grid2.rotation.z=Math.PI; scene.add(grid2);

const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.6,0.85,0.0);composer.addPass(bloom);composer.setSize(innerWidth,innerHeight);

const $=s=>document.querySelector(s);
$('#amp').oninput=e=>uniforms.uAmp.value=+e.target.value;
$('#spd').oninput=e=>uniforms.uSpd.value=+e.target.value;
$('#hue').oninput=e=>uniforms.uHue.value=+e.target.value;
$('#bStr').oninput=e=>bloom.strength=+e.target.value;
$('#grid').onchange=e=>{grid.visible=grid2.visible=e.target.checked;};
$('#fill').onchange=e=>{fill.visible=fill2.visible=e.target.checked;};

const mouse={x:0,y:0};addEventListener('pointermove',e=>{mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});

const clock=new THREE.Clock();
function frame(){const t=clock.getElapsedTime();uniforms.uTime.value=t;
  camera.position.x+=((mouse.x*60)-camera.position.x)*0.04;
  camera.position.y+=((70+mouse.y*40)-camera.position.y)*0.04;
  camera.lookAt(0,30,-150);
  composer.render();requestAnimationFrame(frame);}
frame();
</script>
</body>
</html>
