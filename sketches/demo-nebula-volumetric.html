<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Void — Volumetric Nebula (raymarched)</title>
<link rel="stylesheet" href="https://use.typekit.net/xan5bdy.css"/>
<script type="importmap">
{ "imports": {
  "three":"https://unpkg.com/three@0.169.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"
}}
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#03040a;font-family:"acumin-pro",system-ui,sans-serif;color:#cfe8ff}
  #scene{position:fixed;inset:0;display:block}
  #content{position:fixed;inset:0;z-index:2;pointer-events:none;display:flex;flex-direction:column;justify-content:center;padding-left:9vw}
  .kick{font-family:"source-code-pro",monospace;color:#7fe0ff;font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;margin-bottom:.8rem}
  h1{font-family:"ogg",serif;font-weight:600;font-size:clamp(3rem,7vw,6rem);color:#fff;line-height:1;text-shadow:0 0 30px rgba(120,200,255,.3)}
  .desc{max-width:38ch;margin-top:1rem;color:#8fb0cc;line-height:1.6}
  #panel{position:fixed;top:1rem;right:1rem;z-index:5;width:212px;max-height:94vh;overflow-y:auto;background:rgba(8,8,18,.85);border:1px solid rgba(150,160,255,.3);border-radius:12px;padding:.8rem .9rem;backdrop-filter:blur(8px);font-size:.64rem;font-family:"source-code-pro",monospace}
  #panel h3{color:#9fd0ff;letter-spacing:.2em;text-transform:uppercase;font-size:.58rem;margin:.7rem 0 .5rem}
  #panel h3:first-child{margin-top:0}
  #panel label{display:block;color:#9bb0cc;text-transform:uppercase;margin:.45rem 0 .15rem;font-size:.55rem}
  #panel input[type=range]{width:100%;accent-color:#9fd0ff}
  #panel .chk{display:flex;gap:.5rem;align-items:center;color:#9bb0cc;margin:.4rem 0;text-transform:uppercase;cursor:pointer}
  #fps{position:fixed;left:1rem;bottom:1rem;z-index:5;font-family:"source-code-pro",monospace;font-size:.62rem;color:#5b768f;letter-spacing:.12em}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="content">
  <div class="kick">CH.00 — The Void</div>
  <h1>Nebula</h1>
  <div class="desc">A raymarched 3D gas cloud — real depth, flown through. Tune the volume, then we fold it into the site.</div>
</div>
<div id="panel">
  <h3>Volume</h3>
  <label>density</label><input type="range" id="dens" min="0" max="1" step="0.01" value="0.55">
  <label>drift speed</label><input type="range" id="spd" min="0" max="2" step="0.02" value="0.7">
  <label>warp / turbulence</label><input type="range" id="warp" min="0" max="3" step="0.05" value="1.5">
  <label>colour (teal↔violet)</label><input type="range" id="hue" min="0" max="1" step="0.01" value="0.5">
  <label>ember veins</label><input type="range" id="ember" min="0" max="1.5" step="0.05" value="0.5">
  <label>bloom</label><input type="range" id="bStr" min="0" max="2" step="0.05" value="0.6">
  <h3>Performance</h3>
  <label>quality (raymarch steps)</label><input type="range" id="steps" min="12" max="64" step="1" value="40">
  <div class="chk"><input type="checkbox" id="half" checked> half-res volume</div>
  <div class="chk"><input type="checkbox" id="fly" checked> auto fly-through</div>
  <h3>Cursor FX</h3>
  <div class="chk"><input type="checkbox" id="curOn" checked> cursor reactive</div>
  <label>cloud glow</label><input type="range" id="flow" min="0" max="2.5" step="0.05" value="1">
  <label>ripple on flick</label><input type="range" id="rip" min="0" max="2" step="0.05" value="1">
  <label>parallax / shake</label><input type="range" id="plx" min="0" max="2" step="0.05" value="1">
</div>
<div id="fps">—</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const canvas = document.querySelector('#scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 6000);
camera.position.set(0, 0, 0);

// ---- Half-res raymarch target for the volumetric nebula ----
let RES = 0.5;                                  // half-res by default (the big perf lever)
const nebRT = new THREE.WebGLRenderTarget(1, 1, { magFilter: THREE.LinearFilter, minFilter: THREE.LinearFilter, depthBuffer: false });
function sizeRT() { nebRT.setSize(Math.max(2, Math.floor(innerWidth * RES)), Math.max(2, Math.floor(innerHeight * RES))); }
sizeRT();

// fullscreen pass that RAYMARCHES a world-space 3D noise volume from the main camera
const nebU = {
  uTime: { value: 0 }, uA: { value: innerWidth / innerHeight }, uSteps: { value: reduced ? 22 : 40 },
  uDens: { value: 0.55 }, uSpd: { value: 0.7 }, uWarp: { value: 1.5 }, uHue: { value: 0.5 }, uEmber: { value: 0.5 },
  uCamPos: { value: new THREE.Vector3() }, uInvProj: { value: new THREE.Matrix4() }, uCamWorld: { value: new THREE.Matrix4() },
  uPt: { value: new THREE.Vector2(0.5, 0.5) }, uVel: { value: 0 }, uFlow: { value: 1 }, uRip: { value: 1 },
  uRipC: { value: new THREE.Vector2(0.5, 0.5) }, uRipT: { value: -9 },
};
const nebMat = new THREE.ShaderMaterial({
  uniforms: nebU, depthTest: false, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `precision highp float;
    varying vec2 vUv;
    uniform vec3 uCamPos; uniform mat4 uInvProj, uCamWorld;
    uniform float uTime,uA,uSteps,uDens,uSpd,uWarp,uHue,uEmber,uVel,uFlow,uRip,uRipT;
    uniform vec2 uPt,uRipC;
    float hash(vec3 p){ p=fract(p*0.3183099+0.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
    float noise(vec3 x){ vec3 i=floor(x),f=fract(x); f=f*f*(3.0-2.0*f);
      return mix(mix(mix(hash(i+vec3(0,0,0)),hash(i+vec3(1,0,0)),f.x),
                     mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                 mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),
                     mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z); }
    float fbm(vec3 p){ float s=0.0,a=0.5; for(int i=0;i<4;i++){ s+=a*noise(p); p=p*2.03+vec3(1.7,9.2,4.3); a*=0.5; } return s; }
    float density(vec3 P){
      vec3 q = P*0.004 + vec3(0.0, uTime*0.02*uSpd, uTime*0.012*uSpd);   // world-scale sample + drift
      vec3 w = vec3(fbm(q+1.3), fbm(q+5.1), fbm(q+9.2));                  // domain-warp folds
      float f = fbm(q + uWarp*w);
      return smoothstep(0.5 - uDens*0.4, 0.9, f);                        // density slider lowers the floor -> more cloud
    }
    void main(){
      vec4 clip = vec4(vUv*2.0-1.0, -1.0, 1.0);
      vec4 vh = uInvProj*clip; vec3 viewDir = normalize(vh.xyz/vh.w);
      vec3 rd = normalize(mat3(uCamWorld)*viewDir);
      vec3 ro = uCamPos;
      float tStart=60.0, tEnd=1700.0; int STEPS=int(uSteps);
      float stepLen=(tEnd-tStart)/uSteps;
      float jitter=hash(vec3(gl_FragCoord.xy, fract(uTime)));
      float t=tStart + jitter*stepLen;
      vec3 teal=vec3(0.05,0.17,0.24), viol=vec3(0.12,0.06,0.22), ember=vec3(0.22,0.09,0.03);
      vec3 climate=mix(teal,viol, clamp(uHue+0.25*sin(uTime*0.05),0.0,1.0));
      vec3 acc=vec3(0.0); float alpha=0.0;
      for(int i=0;i<64;i++){
        if(i>=STEPS || alpha>0.97) break;
        vec3 p=ro+rd*t;
        float d=density(p);
        if(d>0.01){
          float fade=smoothstep(tEnd,tStart,t);                          // far cloud thins to haze
          vec3 emit=climate*1.8 + ember*smoothstep(0.5,1.0,d)*uEmber*2.5; // teal/violet body + ember cores
          float a=clamp(d*(stepLen*0.006)*(0.7+uDens)*fade, 0.0, 1.0);
          acc+=emit*a*(1.0-alpha); alpha+=a*(1.0-alpha);
        }
        t+=stepLen;
      }
      vec3 col=vec3(0.012,0.020,0.030)+acc;
      vec2 pd=(uPt-vUv); pd.x*=uA; float prox=smoothstep(0.45,0.0,length(pd));
      col+=climate*prox*(0.10+uVel*0.6)*uFlow;                            // cursor glow
      float rt=uTime-uRipT;
      if(rt<2.5){ vec2 rr=(uRipC-vUv); rr.x*=uA; float r=length(rr);
        col+=climate*sin(r*26.0-rt*7.0)*exp(-rt*2.2)*smoothstep(0.5,0.0,r)*0.4*uRip; }
      col*=1.0-0.5*smoothstep(0.3,1.0,distance(vUv,vec2(0.5)));           // vignette
      col+=(hash(vec3(gl_FragCoord.xy,1.0))-0.5)/255.0;                   // dither
      gl_FragColor=vec4(col,1.0);
    }`,
});
const fsScene = new THREE.Scene();
const fsCam = new THREE.Camera();
fsScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), nebMat));

// composite the raymarched volume into the main scene as the backdrop (upscaled)
const composite = new THREE.Mesh(
  new THREE.PlaneGeometry(2, 2),
  new THREE.ShaderMaterial({
    depthTest: false, depthWrite: false, uniforms: { uTex: { value: nebRT.texture } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.999, 1.0); }`,
    fragmentShader: `varying vec2 vUv; uniform sampler2D uTex; void main(){ gl_FragColor = texture2D(uTex, vUv); }`,
  }));
composite.frustumCulled = false; composite.renderOrder = -10; scene.add(composite);

// ---- starfield (a 3D volume, streamed) — composited ON TOP of the nebula ----
const DEPTH = 1800, N = reduced ? 700 : 1400;
const spos = new Float32Array(N * 3), seed = new Float32Array(N), mag = new Float32Array(N), tmp = new Float32Array(N);
for (let i = 0; i < N; i++) {
  spos[i*3] = (Math.random()*2-1)*1200; spos[i*3+1] = (Math.random()*2-1)*760; spos[i*3+2] = -Math.random()*DEPTH;
  seed[i] = Math.random()*6.28; mag[i] = Math.pow(Math.random(), 3.2); tmp[i] = 0.45+Math.random()*0.55-Math.random()*0.18;
}
const sgeo = new THREE.BufferGeometry();
sgeo.setAttribute('position', new THREE.BufferAttribute(spos, 3));
sgeo.setAttribute('seed', new THREE.BufferAttribute(seed, 1));
sgeo.setAttribute('mag', new THREE.BufferAttribute(mag, 1));
sgeo.setAttribute('tmp', new THREE.BufferAttribute(tmp, 1));
const smat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uTime: { value: 0 }, uDepth: { value: DEPTH }, uSpeed: { value: 26 } },
  vertexShader: `attribute float seed; attribute float mag; attribute float tmp;
    varying float vT; varying float vMag; varying float vTmp; varying float vFade;
    uniform float uTime,uDepth,uSpeed;
    void main(){ float rate=0.5+seed*0.25; vT=0.7+0.3*sin(uTime*rate+seed)*(1.0-mag*0.7); vMag=mag; vTmp=tmp;
      float z=mod(position.z+uTime*uSpeed,uDepth)-uDepth;
      vec4 mv=modelViewMatrix*vec4(position.x,position.y,z,1.0); float depth=-mv.z;
      vFade=smoothstep(uDepth*1.05+360.0,uDepth*0.45,depth);
      gl_PointSize=(1.0+mag*7.0)*(520.0/depth); gl_Position=projectionMatrix*mv; }`,
  fragmentShader: `varying float vT; varying float vMag; varying float vTmp; varying float vFade;
    void main(){ vec2 c=gl_PointCoord-0.5; float r=length(c);
      float core=1.0-smoothstep(0.0,0.18,r); float halo=(1.0-smoothstep(0.0,0.5,r))*0.55;
      float spike=max(1.0-abs(c.x)*22.0,0.0)*(1.0-smoothstep(0.0,0.5,abs(c.y)))+max(1.0-abs(c.y)*22.0,0.0)*(1.0-smoothstep(0.0,0.5,abs(c.x)));
      spike*=smoothstep(0.55,1.0,vMag)*0.6; float i=(core+halo+spike)*vT*vFade;
      vec3 col=mix(vec3(1.0,0.78,0.55),vec3(0.62,0.80,1.0),smoothstep(0.0,1.0,vTmp)); col=mix(col,vec3(1.0),core*0.6);
      gl_FragColor=vec4(col*i,i); }`,
});
const stars = new THREE.Points(sgeo, smat); stars.frustumCulled = false; scene.add(stars);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.7, 0.22);
composer.addPass(bloom); composer.setSize(innerWidth, innerHeight);

// ---- controls ----
const $ = (s) => document.querySelector(s);
let flyOn = !reduced, curOn = true, flowAmt = 1, ripAmt = 1, plxAmt = 1;
$('#dens').oninput = (e) => nebU.uDens.value = +e.target.value;
$('#spd').oninput = (e) => nebU.uSpd.value = +e.target.value;
$('#warp').oninput = (e) => nebU.uWarp.value = +e.target.value;
$('#hue').oninput = (e) => nebU.uHue.value = +e.target.value;
$('#ember').oninput = (e) => nebU.uEmber.value = +e.target.value;
$('#bStr').oninput = (e) => bloom.strength = +e.target.value;
$('#steps').oninput = (e) => nebU.uSteps.value = +e.target.value;
$('#half').onchange = (e) => { RES = e.target.checked ? 0.5 : 1.0; sizeRT(); };
$('#fly').onchange = (e) => flyOn = e.target.checked;
$('#curOn').onchange = (e) => curOn = e.target.checked;
$('#flow').oninput = (e) => flowAmt = +e.target.value;
$('#rip').oninput = (e) => ripAmt = +e.target.value;
$('#plx').oninput = (e) => plxAmt = +e.target.value;
if (reduced) { $('#fly').checked = false; $('#steps').value = 22; }

// ---- cursor (smoothed velocity drives glow + ripple + parallax) ----
const mouse = { x: 0, y: 0 }; let pUV = { x: 0.5, y: 0.5 }, rawVel = 0, vel = 0;
addEventListener('pointermove', (e) => {
  mouse.x = (e.clientX/innerWidth)*2-1; mouse.y = -(e.clientY/innerHeight)*2+1;
  const nx = e.clientX/innerWidth, ny = 1.0-e.clientY/innerHeight;
  rawVel = Math.min(Math.hypot(nx-pUV.x, ny-pUV.y)*9.0, 2.5); pUV.x = nx; pUV.y = ny;
  if (curOn && ripAmt > 0 && rawVel > 1.2) { nebU.uRipC.value.set(nx, ny); nebU.uRipT.value = clock.getElapsedTime(); }
});
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  sizeRT(); nebU.uA.value = innerWidth/innerHeight;
});

const clock = new THREE.Clock();
let fz = 0, fAcc = 0, fN = 0, fLast = performance.now();
function frame() {
  const t = clock.getElapsedTime(), dt = Math.min(clock.getDelta(), 0.05);
  vel += (rawVel - vel)*0.12; rawVel *= 0.90;
  const g = curOn ? 1 : 0;

  // fly the camera forward through the volume (real parallax) + mouse parallax + shake
  if (flyOn) fz -= dt * 90;
  camera.position.x += ((mouse.x*40*plxAmt) - camera.position.x)*0.04 + (Math.random()-0.5)*vel*1.4*plxAmt*g;
  camera.position.y += ((mouse.y*26*plxAmt) - camera.position.y)*0.04 + (Math.random()-0.5)*vel*1.4*plxAmt*g;
  camera.position.z = fz;
  camera.lookAt(camera.position.x*0.4, camera.position.y*0.4, fz - 200);
  camera.updateMatrixWorld();

  // feed the main camera into the raymarch + cursor uniforms
  nebU.uTime.value = t; smat.uniforms.uTime.value = t;
  nebU.uCamPos.value.copy(camera.position);
  nebU.uInvProj.value.copy(camera.projectionMatrixInverse);
  nebU.uCamWorld.value.copy(camera.matrixWorld);
  nebU.uPt.value.set(pUV.x, pUV.y); nebU.uVel.value = vel*g; nebU.uFlow.value = flowAmt*g; nebU.uRip.value = ripAmt*g;

  // 1) raymarch the volume into the half-res target, 2) composite + stars + bloom
  renderer.setRenderTarget(nebRT); renderer.render(fsScene, fsCam); renderer.setRenderTarget(null);
  composer.render();

  fAcc += performance.now() - fLast; fLast = performance.now(); fN++;
  if (fAcc >= 500) { $('#fps').textContent = `${(fN/fAcc*1000).toFixed(0)} fps · ${nebRT.width}×${nebRT.height} vol · ${nebU.uSteps.value|0} steps`; fAcc = 0; fN = 0; }
  requestAnimationFrame(frame);
}
fLast = performance.now(); frame();
</script>
</body>
</html>
