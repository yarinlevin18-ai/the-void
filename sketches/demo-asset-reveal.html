<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Void — Asset Reveal Demo</title>
<link rel="stylesheet" href="https://use.typekit.net/xan5bdy.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js" } }
</script>
<style>
  :root{ --cyan:#4fd2ff; --ink:#eaf4ff; --dim:#8fb0cc; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#05070b;font-family:"acumin-pro",system-ui,sans-serif;color:var(--ink)}
  #scene{position:fixed;inset:0;display:block}
  /* DOM content overlay, anchored over the 3D panel */
  #content{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;
    padding-left:9vw;pointer-events:none;z-index:2}
  #content .kicker{font-family:"source-code-pro",monospace;color:var(--cyan);font-size:.72rem;
    letter-spacing:.28em;text-transform:uppercase;margin-bottom:1rem;opacity:0}
  #content h1{font-family:"ogg",serif;font-weight:600;font-size:clamp(3rem,8vw,7rem);line-height:.95;
    letter-spacing:.01em;color:#fff;text-shadow:0 0 40px rgba(79,210,255,.25)}
  #content h1 .ch{display:inline-block;will-change:transform,opacity}
  #content .desc{max-width:42ch;margin-top:1.2rem;color:var(--dim);font-size:clamp(1rem,1.5vw,1.2rem);
    line-height:1.6;opacity:0}
  #content .meta{font-family:"source-code-pro",monospace;color:#5b768f;font-size:.7rem;
    letter-spacing:.18em;text-transform:uppercase;margin-top:.8rem;opacity:0}
  #content .cta{margin-top:2rem;pointer-events:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:.6rem;
    font-family:"source-code-pro",monospace;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--cyan);background:transparent;border:1px solid rgba(79,210,255,.55);border-radius:999px;
    padding:.75rem 1.5rem;cursor:pointer;opacity:0}
  /* controls */
  #ui{position:fixed;left:50%;bottom:1.6rem;transform:translateX(-50%);z-index:3;display:flex;gap:.6rem}
  #ui button{font-family:"source-code-pro",monospace;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink);background:rgba(79,210,255,.1);border:1px solid rgba(79,210,255,.45);border-radius:999px;
    padding:.55rem 1.1rem;cursor:pointer}
  #ui button:hover{background:rgba(79,210,255,.22)}
  #hint{position:fixed;right:1.4rem;bottom:1.4rem;z-index:3;font-family:"source-code-pro",monospace;
    font-size:.62rem;letter-spacing:.12em;color:#5b768f;text-transform:uppercase}
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="content">
    <div class="kicker">Project 01 — SaaS / CRM</div>
    <h1 id="title">TEEPO</h1>
    <div class="desc">A full SaaS product — Next.js, Flask, Supabase &amp; AI. Real complexity: auth, billing, RTL, dashboards.</div>
    <div class="meta">Next.js · Flask · Supabase · AI</div>
    <button class="cta" id="cta">Visit live ↗</button>
  </div>
  <div id="ui">
    <button id="replay">▶ Replay reveal</button>
    <button id="out">◂ Recede</button>
  </div>
  <div id="hint">move mouse — parallax</div>

<script type="module">
import * as THREE from 'three';

const canvas = document.querySelector('#scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070b, 0.0009);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(0,0,120);

// ---- void: drifting points ----
const N=1400, P=new Float32Array(N*3), C=new Float32Array(N*3);
const a=new THREE.Color(0x2f6f8f), b=new THREE.Color(0xeaf4ff), t=new THREE.Color();
for(let i=0;i<N;i++){
  P[i*3]=(Math.random()-0.5)*900; P[i*3+1]=(Math.random()-0.5)*600; P[i*3+2]=(Math.random()-0.5)*900-200;
  t.copy(a).lerp(b,Math.random()); C[i*3]=t.r;C[i*3+1]=t.g;C[i*3+2]=t.b;
}
const pg=new THREE.BufferGeometry();
pg.setAttribute('position',new THREE.BufferAttribute(P,3));
pg.setAttribute('color',new THREE.BufferAttribute(C,3));
const points=new THREE.Points(pg,new THREE.PointsMaterial({size:1.6,sizeAttenuation:true,vertexColors:true,transparent:true,opacity:.85,depthWrite:false,blending:THREE.AdditiveBlending}));
scene.add(points);

// ---- the project panel (group: glow + image plane + frame) ----
const project = new THREE.Group();
scene.add(project);

// fake SaaS dashboard "screenshot" drawn to a canvas (stands in for /previews/teepo.webp)
function makeMockTexture(){
  const w=1024,h=640,cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');
  x.fillStyle='#0a141d';x.fillRect(0,0,w,h);
  x.fillStyle='#0e1c28';x.fillRect(0,0,w,64); // top bar
  x.fillStyle='#4fd2ff';x.beginPath();x.arc(36,32,10,0,7);x.fill();
  x.fillStyle='#24414f';x.fillRect(64,26,120,12);x.fillRect(w-150,24,120,16);
  x.fillStyle='#0e1c28';x.fillRect(0,64,210,h-64); // sidebar
  for(let i=0;i<6;i++){x.fillStyle=i===1?'rgba(79,210,255,.22)':'#15262f';x.fillRect(24,110+i*54,162,30);}
  // cards
  const cardX=250;
  for(let i=0;i<3;i++){x.fillStyle='#11212d';x.fillRect(cardX+i*248,100,224,120);x.fillStyle='#4fd2ff';x.fillRect(cardX+i*248+18,118,60,10);x.fillStyle='#cfe8ff';x.font='bold 34px sans-serif';x.fillText(['$48k','1,204','98%'][i],cardX+i*248+18,175);}
  // chart bars
  const bx=250,by=270,bw=722,bh=300;x.fillStyle='#0d1923';x.fillRect(bx,by,bw,bh);
  for(let i=0;i<14;i++){const bh2=40+Math.random()*220;x.fillStyle='rgba(79,210,255,'+(0.35+Math.random()*0.5)+')';x.fillRect(bx+24+i*48,by+bh-bh2-20,26,bh2);}
  // line
  x.strokeStyle='#7fe3ff';x.lineWidth=3;x.beginPath();for(let i=0;i<40;i++){const px=bx+20+i*18,py=by+120+Math.sin(i*0.5)*60;i?x.lineTo(px,py):x.moveTo(px,py);}x.stroke();
  const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=4;return tex;
}
const PW=92,PH=PW*0.625;
const img=new THREE.Mesh(new THREE.PlaneGeometry(PW,PH),
  new THREE.MeshBasicMaterial({map:makeMockTexture(),transparent:true,opacity:0}));
img.position.x = 26;             // sits to the right; text lives on the left
project.add(img);
// glowing frame
const edges=new THREE.EdgesGeometry(new THREE.PlaneGeometry(PW,PH));
const frame=new THREE.LineSegments(edges,new THREE.LineBasicMaterial({color:0x4fd2ff,transparent:true,opacity:0}));
frame.position.copy(img.position);project.add(frame);
// soft glow behind (additive sprite)
function glowTex(){const s=256,cv=document.createElement('canvas');cv.width=cv.height=s;const g=cv.getContext('2d').createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);g.addColorStop(0,'rgba(79,210,255,0.55)');g.addColorStop(1,'rgba(79,210,255,0)');const c=cv.getContext('2d');c.fillStyle=g;c.fillRect(0,0,s,s);return new THREE.CanvasTexture(cv);}
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex(),transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
glow.scale.set(180,140,1);glow.position.set(26,0,-6);project.add(glow);

// ---- split the headline into letters for staggered reveal ----
const title=document.querySelector('#title');
title.innerHTML=[...title.textContent].map(c=>`<span class="ch">${c}</span>`).join('');
const chars=title.querySelectorAll('.ch');
const kicker=document.querySelector('.kicker'), desc=document.querySelector('.desc'),
      meta=document.querySelector('.meta'), cta=document.querySelector('#cta');

// ---- the reveal timeline (GSAP) ----
function buildIn(){
  const tl=gsap.timeline({defaults:{ease:'power3.out'}});
  tl.set(chars,{yPercent:120,opacity:0});
  tl.to(camera.position,{z:90,duration:1.4,ease:'power2.inOut'},0);
  tl.to(img.material,{opacity:1,duration:1.0},0.1);
  tl.to(frame.material,{opacity:0.9,duration:1.0},0.1);
  tl.to(glow.material,{opacity:0.9,duration:1.2},0.0);
  tl.fromTo(img.scale,{x:0.85,y:0.85},{x:1,y:1,duration:1.2,ease:'power2.out'},0.1);
  tl.to(kicker,{opacity:1,y:0,duration:.6},0.3);
  tl.to(chars,{yPercent:0,opacity:1,duration:.7,stagger:0.05},0.4);
  tl.to(desc,{opacity:1,y:0,duration:.7},0.9);
  tl.to(meta,{opacity:1,duration:.6},1.05);
  tl.to(cta,{opacity:1,duration:.6},1.2);
  tl.to(cta,{backgroundColor:'rgba(79,210,255,0.16)',boxShadow:'0 0 24px rgba(79,210,255,0.3)',duration:.5},1.3);
  return tl;
}
let tl=buildIn();
document.querySelector('#replay').onclick=()=>{ gsap.set([kicker,desc,meta,cta],{clearProps:'all'}); tl=buildIn(); };
document.querySelector('#out').onclick=()=>{ tl.timeScale(1.6).reverse(); };
cta.onclick=()=>window.open('https://example.com','_blank','noopener');

// ---- mouse parallax ----
const mouse={x:0,y:0};
addEventListener('pointermove',e=>{mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=(e.clientY/innerHeight)*2-1;});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

const clock=new THREE.Clock();
(function loop(){
  const e=clock.getElapsedTime();
  points.rotation.y=e*0.02;
  // parallax: ease the project + camera toward the mouse
  project.rotation.y += ((mouse.x*0.18) - project.rotation.y)*0.05;
  project.rotation.x += ((-mouse.y*0.12) - project.rotation.x)*0.05;
  camera.position.x += ((mouse.x*6) - camera.position.x)*0.04;
  camera.position.y += ((-mouse.y*5) - camera.position.y)*0.04;
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
