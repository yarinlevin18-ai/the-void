<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Void — Liquid-glass cursor</title>
<link rel="stylesheet" href="https://use.typekit.net/xan5bdy.css"/>
<script type="importmap">
{ "imports": { "three":"https://unpkg.com/three@0.169.0/build/three.module.js" }}
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#04050c;cursor:none;font-family:"acumin-pro",system-ui,sans-serif;color:#cfe8ff}
  #scene{position:fixed;inset:0;display:block}
  #content{position:fixed;inset:0;z-index:2;pointer-events:none;display:flex;flex-direction:column;justify-content:center;padding-left:9vw}
  .kick{font-family:"source-code-pro",monospace;color:#7fe0ff;font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;margin-bottom:.8rem}
  h1{font-family:"ogg",serif;font-weight:600;font-size:clamp(3rem,7vw,6rem);color:#fff;line-height:1}
  .desc{max-width:38ch;margin-top:1rem;color:#8fb0cc;line-height:1.6}
  #panel{position:fixed;top:1rem;right:1rem;z-index:5;width:200px;background:rgba(10,10,22,.85);border:1px solid rgba(150,160,255,.3);border-radius:12px;padding:.8rem .9rem;backdrop-filter:blur(8px);font-size:.66rem;font-family:"source-code-pro",monospace}
  #panel h3{color:#9fd0ff;letter-spacing:.2em;text-transform:uppercase;font-size:.6rem;margin-bottom:.6rem}
  #panel label{display:block;color:#9bb0cc;text-transform:uppercase;margin:.5rem 0 .2rem;font-size:.57rem}
  #panel input[type=range]{width:100%;accent-color:#9fd0ff}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="content">
  <div class="kick">CH.00 — interaction</div>
  <h1>Liquid&nbsp;glass</h1>
  <div class="desc">A glass lens follows the cursor and refracts the void behind it. Move fast to watch it stretch.</div>
</div>
<div id="panel">
  <h3>Glass cursor</h3>
  <label>lens size</label><input type="range" id="size" min="0.015" max="0.18" step="0.003" value="0.045">
  <label>refraction</label><input type="range" id="refr" min="0" max="1.2" step="0.02" value="0.55">
  <label>magnify</label><input type="range" id="mag" min="0" max="0.6" step="0.01" value="0.10">
  <label>chromatic edge</label><input type="range" id="chr" min="0" max="1.5" step="0.02" value="0.6">
  <label>rim / specular</label><input type="range" id="rim" min="0" max="1.5" step="0.02" value="0.7">
  <label>squish (liquid)</label><input type="range" id="sq" min="0" max="1.5" step="0.02" value="0.8">
</div>

<script type="module">
import * as THREE from 'three';
const canvas=document.querySelector('#scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(innerWidth,innerHeight);
const ortho=new THREE.OrthographicCamera(-1,1,1,-1,0,1);

// ---- render target that holds the nebula (what the glass will refract) ----
let rt;
function makeRT(){ if(rt)rt.dispose();
  rt=new THREE.WebGLRenderTarget(innerWidth*renderer.getPixelRatio(),innerHeight*renderer.getPixelRatio(),
    {minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter}); }
makeRT();

// ---- NEBULA pass (fbm cloud + sparse bright stars so the lens has detail to magnify) ----
const nebScene=new THREE.Scene();
const neb={uTime:{value:0},uA:{value:innerWidth/innerHeight}};
const nebMat=new THREE.ShaderMaterial({uniforms:neb,
  vertexShader:`varying vec2 v;void main(){v=uv;gl_Position=vec4(position.xy,0.0,1.0);}`,
  fragmentShader:`varying vec2 v;uniform float uTime,uA;
   float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
   float n(vec2 p){vec2 i=floor(p),f=fract(p);float a=h(i),b=h(i+vec2(1,0)),c=h(i+vec2(0,1)),d=h(i+vec2(1,1));vec2 u=f*f*(3.-2.*f);return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);}
   float fbm(vec2 p){float s=0.,m=.5;for(int i=0;i<6;i++){s+=m*n(p);p=p*2.03+1.7;m*=.5;}return s;}
   void main(){vec2 uv=v;uv.x*=uA;
     vec2 q=vec2(fbm(uv*2.0+vec2(0.,uTime*0.03)),fbm(uv*2.0+vec2(5.2,-uTime*0.03)));
     vec2 r=vec2(fbm(uv*2.0+1.5*q+vec2(1.7,9.2)),fbm(uv*2.0+1.5*q+vec2(8.3,2.8)));
     float f=fbm(uv*2.0+1.5*r);
     vec3 climate=mix(vec3(0.05,0.17,0.24),vec3(0.12,0.06,0.22),0.5+0.5*sin(uTime*0.07));
     vec3 col=vec3(0.012,0.020,0.030)+climate*smoothstep(0.38,1.0,f);
     col+=vec3(0.22,0.09,0.03)*smoothstep(0.6,0.95,r.x*r.y+0.4*f)*0.5;
     col+=climate*1.2*smoothstep(0.8,1.0,f);
     // sparse procedural stars (detail for the lens to magnify)
     float star=smoothstep(0.992,1.0,h(floor(uv*90.0)));
     col+=vec3(0.7,0.85,1.0)*star;
     col*=1.0-0.55*smoothstep(0.3,0.95,distance(v,vec2(0.5)));
     gl_FragColor=vec4(col,1.0);}`});
nebScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),nebMat));

// ---- GLASS composite pass ----
const glassScene=new THREE.Scene();
const gu={
  tNeb:{value:null}, uRes:{value:new THREE.Vector2(innerWidth,innerHeight)},
  uMouse:{value:new THREE.Vector2(0.5,0.5)}, uVel:{value:new THREE.Vector2(0,0)}, uSpd:{value:0},
  uSize:{value:0.045}, uRefr:{value:0.5}, uMag:{value:0.10}, uChr:{value:0.5}, uRim:{value:0.6}, uSquish:{value:0.8}
};
const glassMat=new THREE.ShaderMaterial({uniforms:gu,
  vertexShader:`varying vec2 vu;void main(){vu=uv;gl_Position=vec4(position.xy,0.0,1.0);}`,
  fragmentShader:`varying vec2 vu;
   uniform sampler2D tNeb;uniform vec2 uRes,uMouse,uVel;uniform float uSpd,uSize,uRefr,uMag,uChr,uRim,uSquish;
   void main(){
     float asp=uRes.x/uRes.y;
     vec2 uv=vu;
     vec2 d=uv-uMouse; d.x*=asp;            // vector from cursor, aspect-correct
     // liquid squish: stretch the lens along the movement direction
     vec2 vel=uVel; if(length(vel)>0.0001){vec2 dir=normalize(vec2(vel.x*asp,vel.y));
       float al=dot(d,dir); vec2 along=dir*al; vec2 perp=d-along;
       d=along/(1.0+uSquish*min(uSpd,1.2)) + perp;}     // compress along motion
     float dist=length(d);
     float R=uSize;
     if(dist>R){ gl_FragColor=texture2D(tNeb,uv); return; }
     // spherical glass bump -> normal
     float hgt=sqrt(max(R*R-dist*dist,0.0))/R;          // 1 center -> 0 edge
     vec2 nrm=d/max(R,1e-4);
     // refraction: bend + magnify samples toward the lens centre
     vec2 baseUV=uMouse + (uv-uMouse)*(1.0-uMag*hgt);   // magnify
     vec2 bend=nrm*uRefr*(1.0-hgt)*0.12;                // edge refraction
     bend.x/=asp;
     // chromatic split grows toward the rim
     float ca=uChr*(1.0-hgt)*0.010;
     vec2 dirn=normalize(vec2(nrm.x/asp,nrm.y)+1e-5);
     vec3 col;
     col.r=texture2D(tNeb, baseUV-bend + dirn*ca).r;
     col.g=texture2D(tNeb, baseUV-bend).g;
     col.b=texture2D(tNeb, baseUV-bend - dirn*ca).b;
     col*=1.04;                                          // glass lets a touch more light
     // fresnel rim
     float rim=pow(dist/R,3.5);
     col+=vec3(0.55,0.78,1.0)*rim*uRim*0.9;
     // specular highlight (light from upper-left)
     vec2 lp=uMouse+vec2(-R*0.34/asp,R*0.34);
     float sp=1.0-smoothstep(0.0,R*0.34,distance(uv,lp));
     col+=vec3(1.0)*pow(sp,2.2)*uRim*0.8*hgt;
     // soft edge feather + faint outer halo (already returned outside R)
     float edge=smoothstep(R,R*0.9,dist);
     vec3 outside=texture2D(tNeb,uv).rgb;
     gl_FragColor=vec4(mix(outside,col,edge),1.0);
   }`});
glassScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),glassMat));

const $=s=>document.querySelector(s);
$('#size').oninput=e=>gu.uSize.value=+e.target.value;
$('#refr').oninput=e=>gu.uRefr.value=+e.target.value;
$('#mag').oninput =e=>gu.uMag.value=+e.target.value;
$('#chr').oninput =e=>gu.uChr.value=+e.target.value;
$('#rim').oninput =e=>gu.uRim.value=+e.target.value;
$('#sq').oninput  =e=>gu.uSquish.value=+e.target.value;

let raw={x:0.5,y:0.5}, sm={x:0.5,y:0.5}, prev={x:0.5,y:0.5};
addEventListener('pointermove',e=>{raw.x=e.clientX/innerWidth; raw.y=1.0-e.clientY/innerHeight;});
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);makeRT();
  neb.uA.value=innerWidth/innerHeight;gu.uRes.value.set(innerWidth,innerHeight);});

const clock=new THREE.Clock();
function frame(){const t=clock.getElapsedTime();
  // spring the lens toward the cursor (lag = liquid feel)
  prev.x=sm.x; prev.y=sm.y;
  sm.x+=(raw.x-sm.x)*0.5; sm.y+=(raw.y-sm.y)*0.5;
  const vx=sm.x-prev.x, vy=sm.y-prev.y, spd=Math.min(Math.hypot(vx,vy)*22,1.4);
  neb.uTime.value=t;
  gu.uMouse.value.set(sm.x,sm.y); gu.uVel.value.set(vx,vy); gu.uSpd.value=spd;
  // 1) nebula -> RT   2) glass composite -> screen
  renderer.setRenderTarget(rt); renderer.render(nebScene,ortho);
  renderer.setRenderTarget(null); gu.tNeb.value=rt.texture; renderer.render(glassScene,ortho);
  requestAnimationFrame(frame);}
frame();
</script>
</body>
</html>
