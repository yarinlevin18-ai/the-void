<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Void — Atmosphere v2</title>
<script type="importmap">
{ "imports": {
  "three":"https://unpkg.com/three@0.169.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"
}}
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#03040a;font-family:"source-code-pro",ui-monospace,monospace;color:#cfe8ff}
  #scene{position:fixed;inset:0;display:block}
  #panel{position:fixed;top:1rem;right:1rem;z-index:5;width:210px;background:rgba(8,12,22,.85);border:1px solid rgba(120,160,255,.3);border-radius:12px;padding:.8rem .9rem;backdrop-filter:blur(8px);font-size:.66rem;letter-spacing:.08em}
  #panel h3{color:#8fd0ff;letter-spacing:.2em;text-transform:uppercase;font-size:.6rem;margin-bottom:.6rem}
  #panel label{display:block;color:#8fb0cc;text-transform:uppercase;margin:.6rem 0 .2rem;font-size:.58rem}
  #panel input[type=range]{width:100%;accent-color:#8fd0ff}
  #panel .chk{display:flex;gap:.5rem;align-items:center;color:#8fb0cc;margin:.4rem 0;text-transform:uppercase;cursor:pointer}
  #panel button{width:100%;margin-top:.7rem;font:inherit;color:#eaf4ff;background:rgba(120,160,255,.2);border:1px solid rgba(120,160,255,.5);border-radius:8px;padding:.45rem;cursor:pointer;text-transform:uppercase;letter-spacing:.12em}
  #tip{position:fixed;left:1.4rem;bottom:1.2rem;z-index:5;color:#5b768f;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="panel">
  <h3>Atmosphere</h3>
  <label>flow strength</label><input type="range" id="flow" min="0" max="3" step="0.05" value="1">
  <label>bloom</label><input type="range" id="bStr" min="0" max="2.5" step="0.05" value="1.1">
  <label>nebula</label><input type="range" id="nStr" min="0" max="1.6" step="0.05" value="1">
  <div class="chk"><input type="checkbox" id="tCore" checked> glowing core</div>
  <div class="chk"><input type="checkbox" id="tColor" checked> color shift</div>
  <button id="warp">⚡ Warp burst</button>
</div>
<div id="tip">flowing currents · pulsing core · move mouse to lean</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const canvas=document.querySelector('#scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x03040a,0.0013);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,4000);camera.position.set(0,0,170);

// ---- shifting nebula background ----
const bgMat=new THREE.ShaderMaterial({depthTest:false,depthWrite:false,fog:false,
  uniforms:{uTime:{value:0},uIntensity:{value:1},uAspect:{value:innerWidth/innerHeight},uShift:{value:1}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.999,1.0);}`,
  fragmentShader:`varying vec2 vUv;uniform float uTime,uIntensity,uAspect,uShift;
    float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    float n(vec2 p){vec2 i=floor(p),f=fract(p);float a=h(i),b=h(i+vec2(1,0)),c=h(i+vec2(0,1)),d=h(i+vec2(1,1));vec2 u=f*f*(3.-2.*f);return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);}
    float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=p*2.02+1.7;a*=.5;}return v;}
    void main(){vec2 uv=vUv;uv.x*=uAspect;float t=uTime*0.025;
      float a=fbm(uv*2.3+vec2(t,t*.6)),b=fbm(uv*1.6-vec2(t*.5,t*.2)+9.0);
      // color world drifts between teal-cyan and indigo-violet over time
      float m=uShift*(0.5+0.5*sin(uTime*0.08));
      vec3 coolA=vec3(0.05,0.17,0.24), coolB=vec3(0.09,0.07,0.22);
      vec3 cloud=mix(coolA,coolB,m);
      vec3 ember=vec3(0.20,0.08,0.04);
      vec3 col=vec3(0.010,0.016,0.028);
      col+=cloud*smoothstep(0.35,0.98,a)*1.0;
      col+=ember*smoothstep(0.74,1.05,a*b)*0.55;
      float d=distance(vUv,vec2(0.5));col*=1.0-0.6*smoothstep(0.32,0.95,d);
      gl_FragColor=vec4(col*uIntensity,1.0);}`});
const bg=new THREE.Mesh(new THREE.PlaneGeometry(2,2),bgMat);bg.frustumCulled=false;bg.renderOrder=-10;scene.add(bg);

// ---- flowing particle currents (curl-noise advection) ----
const N=1500, BOX=520, DEPTH=520;
const pos=new Float32Array(N*3);
const aPhase=new Float32Array(N), aScale=new Float32Array(N), aLayer=new Float32Array(N), aColor=new Float32Array(N*3);
const cCyan=new THREE.Color(0x6fe0ff),cWhite=new THREE.Color(0xeffaff),cEmber=new THREE.Color(0xff7a3d),cViolet=new THREE.Color(0x9a8cff),tmp=new THREE.Color();
for(let i=0;i<N;i++){
  pos[i*3]=(Math.random()-.5)*BOX*2; pos[i*3+1]=(Math.random()-.5)*BOX*1.3; pos[i*3+2]=(Math.random()-.5)*DEPTH-120;
  aPhase[i]=Math.random()*6.28; aLayer[i]=Math.random(); aScale[i]=0.5+Math.random()*1.7;
  const r=Math.random(); tmp.copy(r<0.10?cEmber:(r<0.22?cViolet:(r<0.55?cWhite:cCyan)));
  aColor[i*3]=tmp.r;aColor[i*3+1]=tmp.g;aColor[i*3+2]=tmp.b;
}
const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
geo.setAttribute('aPhase',new THREE.BufferAttribute(aPhase,1));
geo.setAttribute('aScale',new THREE.BufferAttribute(aScale,1));
geo.setAttribute('aLayer',new THREE.BufferAttribute(aLayer,1));
geo.setAttribute('aColor',new THREE.BufferAttribute(aColor,3));
const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  uniforms:{uTime:{value:0},uSize:{value:8},uWarp:{value:0},uPulse:{value:-1},uCore:{value:new THREE.Vector3(0,0,-60)}},
  vertexShader:`attribute float aPhase,aScale,aLayer;attribute vec3 aColor;
    uniform float uTime,uSize,uWarp,uPulse;uniform vec3 uCore;varying vec3 vC;varying float vB;
    void main(){float tw=0.55+0.45*sin(uTime*1.5+aPhase);
      float ring=uPulse<0.0?0.0:smoothstep(38.0,0.0,abs(length(position-uCore)-uPulse));
      vC=aColor; vB=tw+ring*1.6;
      vec4 mv=modelViewMatrix*vec4(position,1.0);gl_Position=projectionMatrix*mv;
      gl_PointSize=aScale*uSize*(0.5+aLayer)*(1.0+uWarp*1.8)*(300.0/ -mv.z);}`,
  fragmentShader:`varying vec3 vC;varying float vB;
    void main(){float d=length(gl_PointCoord-0.5);if(d>0.5)discard;float a=smoothstep(0.5,0.0,d);gl_FragColor=vec4(vC*(0.6+vB),a*min(vB,1.6));}`});
const pts=new THREE.Points(geo,mat);scene.add(pts);

// ---- glowing pulsing core ----
function radial(c0,c1){const s=256,cv=document.createElement('canvas');cv.width=cv.height=s;const x=cv.getContext('2d');const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);g.addColorStop(0,c0);g.addColorStop(.4,c1);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,s,s);return new THREE.CanvasTexture(cv);}
const core=new THREE.Sprite(new THREE.SpriteMaterial({map:radial('rgba(220,245,255,.95)','rgba(90,170,255,.5)'),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
core.scale.set(140,140,1);core.position.set(0,0,-60);scene.add(core);

// ---- bloom ----
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.1,0.75,0.2);composer.addPass(bloom);composer.setSize(innerWidth,innerHeight);

// ---- curl-noise flow field ----
function hsh(x,y){return fract(Math.sin(x*127.1+y*311.7)*43758.5453);} function fract(v){return v-Math.floor(v);}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hsh(xi,yi),b=hsh(xi+1,yi),c=hsh(xi,yi+1),d=hsh(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
const SC=0.0045,EPS=1.2;
function curl(x,y,t){ // velocity = curl of scalar potential -> divergence-free flowing currents
  const p1=vn(x*SC,(y+EPS)*SC+t),p2=vn(x*SC,(y-EPS)*SC+t),p3=vn((x+EPS)*SC,y*SC+t),p4=vn((x-EPS)*SC,y*SC+t);
  return [ (p1-p2)/(2*EPS), -(p3-p4)/(2*EPS) ];
}

// ---- controls ----
const $=s=>document.querySelector(s);
let flow=1,coreOn=true;
$('#flow').oninput=e=>flow=+e.target.value;
$('#bStr').oninput=e=>bloom.strength=+e.target.value;
$('#nStr').oninput=e=>bgMat.uniforms.uIntensity.value=+e.target.value;
$('#tCore').onchange=e=>{coreOn=e.target.checked;core.visible=coreOn;};
$('#tColor').onchange=e=>bgMat.uniforms.uShift.value=e.target.checked?1:0;
let warp=0;$('#warp').onclick=()=>warp=1;

// energy ripple from core, periodic
let pulse=-1,pulseTimer=0;

const mouse={x:0,y:0};addEventListener('pointermove',e=>{mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);bgMat.uniforms.uAspect.value=innerWidth/innerHeight;});

const clock=new THREE.Clock();const baseZ=170;
function frame(){
  const dt=Math.min(clock.getDelta(),0.05), t=clock.getElapsedTime();
  mat.uniforms.uTime.value=t;bgMat.uniforms.uTime.value=t;
  // advect every particle along the curl-noise current
  const fld=flow*34;
  for(let i=0;i<N;i++){
    const x=pos[i*3],y=pos[i*3+1];const v=curl(x,y,t*0.06);
    const sp=fld*(0.5+aLayer[i]);
    pos[i*3]   = x + v[0]*sp*dt*60;
    pos[i*3+1] = y + v[1]*sp*dt*60;
    pos[i*3+2] += Math.sin(t*0.2+aPhase[i])*0.15;      // gentle z breathing
    // wrap inside the box so currents never run dry
    if(pos[i*3]> BOX)pos[i*3]=-BOX; else if(pos[i*3]<-BOX)pos[i*3]=BOX;
    if(pos[i*3+1]> BOX)pos[i*3+1]=-BOX; else if(pos[i*3+1]<-BOX)pos[i*3+1]=BOX;
  }
  geo.attributes.position.needsUpdate=true;

  // pulsing core + periodic energy ripple
  if(coreOn){const s=130+Math.sin(t*1.3)*18;core.scale.set(s,s,1);core.material.opacity=0.8+Math.sin(t*1.3)*0.15;
    core.position.x=Math.sin(t*0.15)*40;core.position.y=Math.cos(t*0.11)*24;mat.uniforms.uCore.value.copy(core.position);}
  pulseTimer+=dt; if(pulse<0 && pulseTimer>4){pulse=0;pulseTimer=0;}
  if(pulse>=0){pulse+=dt*180; if(pulse>720)pulse=-1;}
  mat.uniforms.uPulse.value=pulse;

  warp*=0.94;if(warp<0.001)warp=0;mat.uniforms.uWarp.value=warp;bloom.strength=(+$('#bStr').value)+warp*0.9;camera.position.z=baseZ-warp*60;

  pts.rotation.y+=((mouse.x*0.16)-pts.rotation.y)*0.04;
  pts.rotation.x+=((-mouse.y*0.10)-pts.rotation.x)*0.04;
  core.position.z=-60;

  composer.render();requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
