<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Void — Wave Ribbon in a Section</title>
<link rel="stylesheet" href="https://use.typekit.net/xan5bdy.css"/>
<script type="importmap">
{ "imports": {
  "three":"https://unpkg.com/three@0.169.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"
}}
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#04050c;font-family:"acumin-pro",system-ui,sans-serif;color:#cfe8ff}
  #scene{position:fixed;inset:0;display:block}
  /* a section's content, so you see the ribbon move AROUND it */
  #content{position:fixed;inset:0;z-index:2;pointer-events:none;display:flex;flex-direction:column;justify-content:center;padding-left:9vw}
  .kick{font-family:"source-code-pro",monospace;color:#7fe0ff;font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;margin-bottom:.8rem}
  h1{font-family:"ogg",serif;font-weight:600;font-size:clamp(3rem,7vw,6rem);color:#fff;line-height:1;text-shadow:0 0 30px rgba(120,200,255,.3)}
  .desc{max-width:38ch;margin-top:1rem;color:#8fb0cc;line-height:1.6}
  #panel{position:fixed;top:1rem;right:1rem;z-index:5;width:200px;background:rgba(10,10,22,.85);border:1px solid rgba(150,160,255,.3);border-radius:12px;padding:.8rem .9rem;backdrop-filter:blur(8px);font-size:.66rem;font-family:"source-code-pro",monospace}
  #panel h3{color:#9fd0ff;letter-spacing:.2em;text-transform:uppercase;font-size:.6rem;margin-bottom:.6rem}
  #panel label{display:block;color:#9bb0cc;text-transform:uppercase;margin:.55rem 0 .2rem;font-size:.57rem}
  #panel input[type=range]{width:100%;accent-color:#9fd0ff}
  #panel .chk{display:flex;gap:.5rem;align-items:center;color:#9bb0cc;margin:.5rem 0;text-transform:uppercase;cursor:pointer}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="content">
  <div class="kick">CH.03 — My Projects</div>
  <h1>My Projects</h1>
  <div class="desc">A neon wave moves through the section — warping and drifting around the content as you read.</div>
</div>
<div id="panel">
  <h3>Wave ribbon</h3>
  <label>wave height</label><input type="range" id="amp" min="0" max="60" step="1" value="26">
  <label>flow speed</label><input type="range" id="spd" min="0" max="3" step="0.05" value="1">
  <label>snake / coil</label><input type="range" id="coil" min="0" max="80" step="1" value="34">
  <label>bloom</label><input type="range" id="bStr" min="0" max="3" step="0.05" value="1.5">
  <div class="chk"><input type="checkbox" id="move" checked> drift around section</div>
  <div class="chk"><input type="checkbox" id="grid" checked> neon grid</div>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const canvas=document.querySelector('#scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x04050c,0.0017);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,0.1,4000);camera.position.set(0,0,360);

// faint nebula backdrop
const bgMat=new THREE.ShaderMaterial({depthTest:false,depthWrite:false,
  uniforms:{uTime:{value:0},uA:{value:innerWidth/innerHeight}},
  vertexShader:`varying vec2 v;void main(){v=uv;gl_Position=vec4(position.xy,0.999,1.0);}`,
  fragmentShader:`varying vec2 v;uniform float uTime,uA;
   float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
   float n(vec2 p){vec2 i=floor(p),f=fract(p);float a=h(i),b=h(i+vec2(1,0)),c=h(i+vec2(0,1)),d=h(i+vec2(1,1));vec2 u=f*f*(3.-2.*f);return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);}
   float fbm(vec2 p){float s=0.,m=.5;for(int i=0;i<4;i++){s+=m*n(p);p=p*2.02+1.7;m*=.5;}return s;}
   void main(){vec2 uv=v;uv.x*=uA;float f=fbm(uv*2.2+vec2(uTime*0.02,0.0));
     vec3 col=vec3(0.012,0.016,0.030)+mix(vec3(0.06,0.16,0.26),vec3(0.14,0.08,0.26),0.5+0.5*sin(uTime*0.07))*smoothstep(0.45,1.0,f);
     col*=1.0-0.55*smoothstep(0.3,0.95,distance(v,vec2(0.5)));gl_FragColor=vec4(col,1.0);}`});
const bg=new THREE.Mesh(new THREE.PlaneGeometry(2,2),bgMat);bg.frustumCulled=false;bg.renderOrder=-10;scene.add(bg);

// ---- the neon wave RIBBON (a contained band, not a full corridor) ----
const uniforms={uTime:{value:0},uAmp:{value:26},uSpd:{value:1},uCoil:{value:34}};
const VERT=`uniform float uTime,uAmp,uSpd,uCoil;varying float vH;varying vec2 vUv;
  void main(){vUv=uv;vec3 p=position;float t=uTime*uSpd;
    float w=sin(p.x*0.018+t*1.8)*uAmp + sin(p.x*0.05-t*1.3)*uAmp*0.45 + sin(p.y*0.06+t)*5.0;
    p.z+=w;                                   // ripple
    p.y+=sin(p.x*0.012+t*0.9)*uCoil;          // whole ribbon snakes up/down
    vH=w;
    gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}`;
const FRAG=line=>`uniform float uTime;varying float vH;varying vec2 vUv;
  void main(){
    vec3 cy=vec3(0.28,0.92,1.0), vi=vec3(0.55,0.40,1.0), mg=vec3(0.92,0.40,0.85);
    float m=fract(vUv.x*1.3 - uTime*0.45);
    vec3 col = m<0.5 ? mix(cy,vi,m*2.0) : mix(vi,mg,(m-0.5)*2.0);
    float crest=smoothstep(0.3,1.0,vH/34.0); col+=crest*0.45;
    // dissolve into the void: feather BOTH long edges AND both ends so there is no hard rectangle
    float edge=smoothstep(0.0,0.18,vUv.y)*smoothstep(1.0,0.82,vUv.y);
    float ends=smoothstep(0.0,0.16,vUv.x)*smoothstep(1.0,0.84,vUv.x);
    float fade=edge*ends;
    float a=(${line?'0.5':'0.10+crest*0.4'})*fade;
    gl_FragColor=vec4(col, a);}`;
const rgeo=new THREE.PlaneGeometry(620,80,320,8);
const fillMat=new THREE.ShaderMaterial({uniforms,vertexShader:VERT,fragmentShader:FRAG(false),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
const lineMat=new THREE.ShaderMaterial({uniforms,vertexShader:VERT,fragmentShader:FRAG(true),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,wireframe:true});
const ribbon=new THREE.Group();
const fill=new THREE.Mesh(rgeo,fillMat),grid=new THREE.Mesh(rgeo,lineMat);
ribbon.add(fill,grid);scene.add(ribbon);

const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.35,1.15,0.0);composer.addPass(bloom);composer.setSize(innerWidth,innerHeight);

const $=s=>document.querySelector(s);let moveOn=true;
$('#amp').oninput=e=>uniforms.uAmp.value=+e.target.value;
$('#spd').oninput=e=>uniforms.uSpd.value=+e.target.value;
$('#coil').oninput=e=>uniforms.uCoil.value=+e.target.value;
$('#bStr').oninput=e=>bloom.strength=+e.target.value;
$('#move').onchange=e=>moveOn=e.target.checked;
$('#grid').onchange=e=>grid.visible=e.target.checked;

const mouse={x:0,y:0};addEventListener('pointermove',e=>{mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);bgMat.uniforms.uA.value=innerWidth/innerHeight;});

const clock=new THREE.Clock();
function frame(){const t=clock.getElapsedTime();uniforms.uTime.value=t;bgMat.uniforms.uTime.value=t;
  if(moveOn){ // the ribbon drifts and turns AROUND the section, bounded
    ribbon.position.set(Math.sin(t*0.22)*130, Math.cos(t*0.18)*70 + 10, Math.sin(t*0.15)*90 - 30);
    ribbon.rotation.y=Math.sin(t*0.13)*0.7; ribbon.rotation.z=Math.sin(t*0.09)*0.35; ribbon.rotation.x=Math.cos(t*0.11)*0.18;
  }
  camera.position.x+=((mouse.x*30)-camera.position.x)*0.04;
  camera.position.y+=((mouse.y*20)-camera.position.y)*0.04;
  camera.lookAt(0,0,0);
  composer.render();requestAnimationFrame(frame);}
frame();
</script>
</body>
</html>
